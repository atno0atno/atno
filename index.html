<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atno_atno</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #394952;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }

        .player {
            width: 80%;
            max-width: 500px;
            margin: 25px auto;
            padding: 20px;
            background: rgb(22, 29, 32);
            border-radius: 16px;
            position: relative;
            box-shadow: 0 0 12px rgba(0,0,0,0.4);
        }

        .menu-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(66,61,46,0.6);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 45px;
            right: 10px;
            background: #333;
            padding: 10px;
            border-radius: 10px;
            width: 160px;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }

        .dropdown button {
            width: 100%;
            margin-bottom: 5px;
            background: rgba(66,61,46,0.6);
            border: none;
            border-radius: 8px;
            color: #fff4c2;
            padding: 6px 0;
            cursor: pointer;
        }

        .volume-panel {
            display: none;
            margin-top: 5px;
        }

        .title {
            font-size: 20px;
            text-align: center;
            margin-top: 15px;
        }

        .time-display {
            text-align: right;
            font-size: 14px;
            margin-top: 5px;
            color: #d4d4d4;
        }

        .progress {
            width: 100%;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        button.control-btn {
            background: rgba(66,61,46,0.7);
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            color: #fff4c2;
            cursor: pointer;
            transition: .2s;
        }

        button.control-btn:hover {
            background: rgba(66,61,46,0.85);
        }

        .mute-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(66,61,46,0.7);
            padding: 12px 14px;
            border-radius: 50%;
            font-size: 20px;
            color: #fff4c2;
            cursor: pointer;
        }
.social-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(66,61,46,0.7);
    display: block;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    margin-bottom: 12px;
    backdrop-filter: blur(4px);
    transition: 0.2s;
    box-sizing: content-box;
    width: 26px;
    height: 26px;
    overflow: visible;

}

.social-btn:hover {
    background: rgba(66,61,46,0.9);
    transform: scale(1.07);
}

.youtube-btn {
    bottom: 80px;
}

.spotify-btn {
    bottom: 20px;
}

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
            color: #bfbfbf;
        }

        footer a {
            color: #ff6262;
            text-decoration: none;
        }
    </style>
</head>

<!-- YouTube (düzgün, taşma yapmayan SVG) -->
<a class="social-btn youtube-btn" href="https://www.youtube.com/channel/UCM0rm1LPj1SazVIce2zm77g" target="_blank" aria-label="YouTube">
  <svg width="26" height="26" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="false">
    <!-- yuvarlak köşeli dikdörtgen (sadece kontur olarak bırakabiliriz) -->
    <rect x="1.5" y="5.5" width="21" height="13" rx="3.2" ry="3.2" fill="none" stroke="#fff4c2" stroke-width="1.2"/>
    <!-- oynat triangle (ikon rengi) -->
    <path d="M10 9.5v5l4-2.5-4-2.5z" fill="#fff4c2"/>
  </svg>
</a>


<a class="social-btn spotify-btn" href="https://open.spotify.com/intl-tr/artist/610tMgfDfO4amDZ7sACp7I?si=5Ieq41-1RQqtJOMuoM-CmA" target="_blank">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff4c2">
        <path d="M12 0C5.4 0 0 5.4 0 12c0 6.7 5.4 12 12 12s12-5.3 12-12C24 5.4 18.6 0 12 0zm5.5 17.3c-.2.3-.6.4-.9.2-2.5-1.5-5.7-1.8-9.4-.9-.4.1-.7-.2-.8-.5-.1-.4.2-.7.5-.8 4-.9 7.6-.6 10.4 1.1.4.2.5.6.3.9zm1.3-3c-.3.4-.8.5-1.2.3-2.9-1.8-7.3-2.3-10.7-1.2-.5.2-1-.1-1.1-.5-.2-.5.1-1 .5-1.1 3.9-1.3 8.8-.7 12.2 1.4.4.2.6.8.3 1.1zm.1-3.2c-3.4-2-9-2.2-12.3-1.2-.6.2-1.2-.2-1.4-.7-.2-.6.2-1.2.7-1.4C9.8 6.7 16 6.9 20 9.3c.5.3.7 1 .4 1.5-.3.5-1 .7-1.5.3z"/>
    </svg>
</a>

<body>
    <div class="player">
        <div class="menu-button" id="menuBtn">⋮</div>

        <div class="dropdown" id="dropdownMenu">
            <button onclick="toggleVolumePanel()">Ses Ayarı</button>
            <button onclick="downloadCurrentTrack()">Parçayı İndir</button>
            <div class="volume-panel" id="volumePanel">
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>

        <div class="title" id="trackTitle">Summer Joy</div>

        <input type="range" id="progressBar" class="progress" value="0" min="0" max="100">
        <div class="time-display" id="timeLabel">0:00 / 0:00</div>

        <div class="controls">
            <button class="control-btn" id="prevBtn">⏮</button>
            <button class="control-btn" id="playPauseBtn">▶</button>
            <button class="control-btn" id="nextBtn">⏭</button>
            <button class="control-btn" id="loopBtn">🔁 Kapalı</button>
        </div>
    </div>

    <div class="mute-button" id="muteBtn">🔊</div>

    <audio id="player" src="Music/Summer Joy.mp3"></audio>

    <footer>
        Bu sitedeki müzikler,
        <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.tr" target="_blank">
            CC BY-NC-ND 4.0 Uluslararası Lisansı
        </a> ile korunmaktadır.
    </footer>

<script>
    const tracks = [
        { name: "Summer Joy", file: "Music/Summer Joy.mp3" },
        { name: "Unknown Intelligence", file: "Music/Unknown Intelligence.mp3" },
        { name: "Experienced Adrenaline", file: "Music/Experienced Adrenaline.mp3" }
    ];

    let index = 0;
    let loopMode = 0;

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    const loopBtn = document.getElementById('loopBtn');
    const progressBar = document.getElementById('progressBar');
    const trackTitle = document.getElementById('trackTitle');
    const timeLabel = document.getElementById('timeLabel');

    const volumeSlider = document.getElementById('volumeSlider');
    const muteBtn = document.getElementById('muteBtn');
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const volumePanel = document.getElementById('volumePanel');

    menuBtn.onclick = () => {
        dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
        volumePanel.style.display = 'none';
    };

    function toggleVolumePanel() {
        volumePanel.style.display = volumePanel.style.display === 'block' ? 'none' : 'block';
    }

    function downloadCurrentTrack() {
        const a = document.createElement('a');
        a.href = tracks[index].file;
        a.download = tracks[index].name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function loadTrack(i) {
        player.src = tracks[i].file;
        trackTitle.textContent = tracks[i].name;
        player.load();
    }

    playPauseBtn.onclick = () => {
        if (player.paused) { player.play(); playPauseBtn.textContent = '⏸'; }
        else { player.pause(); playPauseBtn.textContent = '▶'; }
    };

    nextBtn.onclick = () => { index = (index+1)%tracks.length; loadTrack(index); player.play(); playPauseBtn.textContent = '⏸'; };
    prevBtn.onclick = () => { index = (index-1+tracks.length)%tracks.length; loadTrack(index); player.play(); playPauseBtn.textContent = '⏸'; };

    loopBtn.onclick = () => {
        loopMode = (loopMode + 1) % 3;
        loopBtn.textContent = ["🔁 Kapalı", "🔂 Parça", "🔁 Liste"][loopMode];
    };

    player.addEventListener('timeupdate', () => {
        progressBar.value = (player.currentTime / player.duration) * 100;
        const cur = Math.floor(player.currentTime);
        const dur = Math.floor(player.duration);
        if (!isNaN(dur)) timeLabel.textContent = `${Math.floor(cur/60)}:${String(cur%60).padStart(2,'0')} / ${Math.floor(dur/60)}:${String(dur%60).padStart(2,'0')}`;
    });

    progressBar.oninput = () => player.currentTime = (progressBar.value/100)*player.duration;
    volumeSlider.oninput = () => player.volume = volumeSlider.value;

    muteBtn.onclick = () => {
        player.muted = !player.muted;
        muteBtn.textContent = player.muted ? '🔇' : '🔊';
    };

    player.addEventListener('ended', () => {
        if (loopMode === 1) { player.currentTime = 0; player.play(); return; }
        if (loopMode === 2) { index = (index+1)%tracks.length; loadTrack(index); player.play(); }
    });

    loadTrack(index);
</script>

</body>
</html>
